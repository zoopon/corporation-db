type: object
properties:
  id:
    type: integer
    format: int64
    description: Corporation ID
    example: 1
  corporate_number:
    type: string
    description: 13-digit corporate number
    pattern: '^[0-9]{13}$'
    example: "1234567890123"
  name:
    type: string
    description: Corporation name
    example: "株式会社サンプル"
  kana:
    type: string
    nullable: true
    description: Corporation name in katakana
    example: "カブシキガイシャサンプル"
  name_en:
    type: string
    nullable: true
    description: Corporation name in English
    example: "Sample Corporation"
  postal_code:
    type: string
    nullable: true
    description: Postal code
    example: "100-0001"
  location:
    type: string
    nullable: true
    description: Head office location
    example: "東京都千代田区千代田1-1"
  status:
    type: string
    description: Corporation status
    example: "01"
  close_date:
    type: string
    format: date
    nullable: true
    description: Registration closure date
    example: "2023-12-01"
  close_cause:
    type: string
    nullable: true
    description: Registration closure reason
    example: "解散"
  representative_name:
    type: string
    nullable: true
    description: Representative name
    example: "田中太郎"
  representative_position:
    type: string
    nullable: true
    description: Representative position
    example: "代表取締役"
  date_of_establishment:
    type: string
    format: date
    nullable: true
    description: Date of establishment
    example: "2020-01-01"
  founding_year:
    type: integer
    nullable: true
    description: Founding year
    example: 2020
  capital_stock:
    type: integer
    format: int64
    nullable: true
    description: Capital stock
    example: 10000000
  employee_number:
    type: integer
    nullable: true
    description: Number of employees
    example: 100
  company_size_male:
    type: integer
    nullable: true
    description: Company size (male employees)
    example: 60
  company_size_female:
    type: integer
    nullable: true
    description: Company size (female employees)
    example: 40
  business_items:
    type: string
    nullable: true
    description: Business items (JSON format)
    example: '["ソフトウェア開発", "システム運用"]'
  business_summary:
    type: string
    nullable: true
    description: Business summary
    example: "ITソリューション事業"
  company_url:
    type: string
    nullable: true
    description: Company website URL
    example: "https://example.com"
  qualification_grade:
    type: string
    nullable: true
    description: Qualification grade
    example: "A"
  number_of_activity:
    type: string
    nullable: true
    description: Number of activity
    example: "1"
  update_date:
    type: string
    format: date
    nullable: true
    description: Last updated date from gBizINFO
    example: "2023-12-01"
  created_at:
    type: string
    format: date-time
    description: Created time
    example: "2023-12-01T09:00:00Z"
  updated_at:
    type: string
    format: date-time
    description: Updated time
    example: "2023-12-01T09:00:00Z"

required:
  - id
  - corporate_number
  - name
  - status
  - created_at
  - updated_at
