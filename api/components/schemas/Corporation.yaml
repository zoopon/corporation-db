type: object
properties:
  id:
    type: integer
    format: int64
    description: Corporation ID
    example: 1
  corporate_number:
    type: string
    description: 13-digit corporate number
    pattern: '^[0-9]{13}$'
    example: "1234567890123"
  name:
    type: string
    description: Corporation name
    example: "株式会社サンプル"
  name_kana:
    type: string
    nullable: true
    description: Corporation name in katakana
    example: "カブシキガイシャサンプル"
  english_name:
    type: string
    nullable: true
    description: Corporation name in English
    example: "Sample Corporation"
  postal_code:
    type: string
    nullable: true
    description: Postal code
    example: "100-0001"
  address:
    type: string
    nullable: true
    description: Address
    example: "東京都千代田区千代田1-1"
  prefecture_code:
    type: string
    nullable: true
    description: Prefecture code
    example: "13"
  city_code:
    type: string
    nullable: true
    description: City code
    example: "13101"
  founding_date:
    type: string
    format: date
    nullable: true
    description: Founding date
    example: "2000-01-01"
  status:
    type: string
    description: Corporation status
    example: "活動中"
  corporate_type:
    type: string
    nullable: true
    description: Corporation type
    example: "株式会社"
  capital_stock:
    type: integer
    format: int64
    nullable: true
    description: Capital stock in yen
    example: 10000000
  employee_number:
    type: integer
    format: int32
    nullable: true
    description: Number of employees
    example: 100
  representative:
    type: string
    nullable: true
    description: Representative name
    example: "田中太郎"
  business_description:
    type: string
    nullable: true
    description: Business description
    example: "ソフトウェア開発"
  industry:
    type: string
    nullable: true
    description: Industry
    example: "情報通信業"
  website:
    type: string
    nullable: true
    description: Website URL
    example: "https://example.com"
  phone:
    type: string
    nullable: true
    description: Phone number
    example: "03-1234-5678"
  email:
    type: string
    nullable: true
    description: Email address
    example: "info@example.com"
  last_updated:
    type: string
    format: date-time
    nullable: true
    description: Last updated time from gBizINFO
    example: "2023-12-01T09:00:00Z"
  created_at:
    type: string
    format: date-time
    description: Created time
    example: "2023-12-01T09:00:00Z"
  updated_at:
    type: string
    format: date-time
    description: Updated time
    example: "2023-12-01T09:00:00Z"
required:
  - id
  - corporate_number
  - name
  - status
  - created_at
  - updated_at
