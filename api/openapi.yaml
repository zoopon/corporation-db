openapi: 3.0.3
info:
  title: Corporation API
  description: Corporation management API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development server

paths:
  /health:
    $ref: './paths/health.yaml'
  /users:
    $ref: './paths/users.yaml'
  /users/{id}:
    $ref: './paths/users_id.yaml'
  /corporations:
    $ref: './paths/corporations.yaml'
  /corporations/{corporate_number}:
    $ref: './paths/corporations_{corporate_number}.yaml'

components:
  schemas:
    User:
      $ref: './components/schemas/User.yaml'
    CreateUserRequest:
      $ref: './components/schemas/CreateUserRequest.yaml'
    Corporation:
      $ref: './components/schemas/Corporation.yaml'
