get:
  summary: Get all corporations
  description: Retrieve a list of all corporations with optional filtering and pagination
  tags:
    - Corporations
  parameters:
    - name: limit
      in: query
      description: Maximum number of corporations to return
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    - name: offset
      in: query
      description: Number of corporations to skip for pagination
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: corporate_number
      in: query
      description: Filter by corporate number
      required: false
      schema:
        type: string
        pattern: '^[0-9]{13}$'
    - name: name
      in: query
      description: Filter by corporation name (partial match)
      required: false
      schema:
        type: string
        maxLength: 255
    - name: prefecture
      in: query
      description: Filter by prefecture
      required: false
      schema:
        type: string
        maxLength: 10
  responses:
    '200':
      description: List of corporations
      content:
        application/json:
          schema:
            type: object
            properties:
              corporations:
                type: array
                items:
                  $ref: '../components/schemas/Corporation.yaml'
              total:
                type: integer
                description: Total number of corporations
              limit:
                type: integer
                description: Limit used for pagination
              offset:
                type: integer
                description: Offset used for pagination
    '400':
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
