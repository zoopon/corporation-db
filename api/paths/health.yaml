get:
  summary: Health check
  description: Check if the API service is healthy and running
  operationId: healthCheck
  tags:
    - health
  responses:
    '200':
      description: Service is healthy
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "ok"
                description: Health status of the service
            required:
              - status
