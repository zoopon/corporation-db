services:
  # メインアプリケーション
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=corporation_db
      - PORT=8080
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQLデータベース
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=corporation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # sqldef migration service（データベースマイグレーション用）
  sqldef:
    image: sqldef/psqldef:latest
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migration

  # Redocly CLI service for OpenAPI management
  redocly:
    image: redocly/cli:latest
    working_dir: /app
    volumes:
      - .:/app
    profiles:
      - docs

  # Batch import service for gBizINFO data
  batch:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: batch
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=corporation_db
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - batch

volumes:
  postgres_data:
