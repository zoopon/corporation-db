services:
  # 開発用アプリケーション（ホットリロード対応）
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: dev
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=corporation_db
      - PORT=8080
      - GO_ENV=development
    volumes:
      # ソースコードをマウントしてホットリロードを実現
      - .:/app
      - /app/bin  # binディレクトリは除外
      - /app/tmp  # tmpディレクトリは除外
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    # Air（ホットリロードツール）でアプリケーションを起動
    command: ["air", "-c", ".air.toml"]

  # PostgreSQLデータベース
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=corporation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # sqldef migration service（データベースマイグレーション用）
  sqldef:
    image: sqldef/psqldef:latest
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migration

  # Redocly CLI service for OpenAPI management
  redocly:
    image: redocly/cli:latest
    working_dir: /app
    volumes:
      - .:/app
    profiles:
      - docs

  # Batch import service for gBizINFO data
  batch:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: batch
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=corporation_db
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - batch

  # Download service for gBizINFO data
  download:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: download
    volumes:
      - ./data:/data
    profiles:
      - data

  # Import service for gBizINFO data
  import:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      target: dev
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=corporation_db
      - GO_ENV=development
    volumes:
      - .:/app
      - ./data:/data
      - /app/bin
      - /app/tmp
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - data
    command: ["go", "run", "./cmd/import", "-input", "/data/input.zip"]

volumes:
  postgres_data:
